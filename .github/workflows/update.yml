name: Update data

on:
  schedule:
    - cron: "30 0 * * 1"   # Mondays 06:00 IST, after the weekend's nightly builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the public CSVs
        run: python scripts/update.py
      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
            git push
          fi
